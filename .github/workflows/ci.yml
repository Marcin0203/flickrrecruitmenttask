name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# A new push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run Lint
        run: ./gradlew assembleDebug lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  unit-tests:
    name: Unit & screenshot tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runs all JVM unit tests; Paparazzi tests compare screens against the committed golden images.
      - name: Run unit tests and verify screenshots
        run: ./gradlew verifyPaparazziDebug

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      # On a mismatch Paparazzi writes delta images (expected | diff | actual) here.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: app/build/paparazzi/failures/
          if-no-files-found: ignore

  ui-tests:
    name: UI tests & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write # posts the coverage comment on the PR
    env:
      EMULATOR_API_LEVEL: 34
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Hardware acceleration is required to run an x86_64 emulator at a usable speed.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Building before the emulator starts keeps the emulator time short.
      - name: Build app and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Restore emulator snapshot
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.EMULATOR_API_LEVEL }}

      - name: Create emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "Created emulator snapshot for caching."

      # Runs unit and UI tests and merges their coverage into one JaCoCo report.
      - name: Run UI tests and generate coverage report
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: ./gradlew jacocoFullTestReport

      - name: Upload UI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/jacoco/jacocoFullTestReport/

      - name: Comment coverage on the PR
        id: coverage
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: ${{ github.workspace }}/app/build/reports/jacoco/jacocoFullTestReport/jacocoFullTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Code coverage (unit + UI tests)
          update-comment: true

      - name: Add coverage to the job summary
        if: github.event_name == 'pull_request'
        run: |
          echo "### Code coverage (unit + UI tests)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Overall: **${{ steps.coverage.outputs.coverage-overall }}%**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Changed files: **${{ steps.coverage.outputs.coverage-changed-files }}%**" >> "$GITHUB_STEP_SUMMARY"
