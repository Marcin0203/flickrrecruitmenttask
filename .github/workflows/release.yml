name: Release

# A push to main happens only when a develop -> main pull request is merged.
on:
  push:
    branches: [main]

# Releases run one after another, never in parallel.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # creates the tag and the GitHub Release

jobs:
  release:
    name: Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Tag = v<versionName>-<run number>, e.g. v1.0-7, so every merge gets a unique release.
      - name: Prepare release tag and APK
        id: release
        run: |
          VERSION_NAME=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          TAG="v${VERSION_NAME}-${GITHUB_RUN_NUMBER}"
          APK="flickr-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" "${{ steps.release.outputs.apk }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.release.outputs.tag }}" \
            --generate-notes
